[default]
cross_correlated_rvs_flag = true  # determines whether we use Morningstar stats as is (false) or if we create cross-correlated RoR
run_cnt = 1000
nb_cpu = 6  # 6 is the optimal number of CPUs to use for parallel processing on Mac Mini M6
seed = 42
max_iter = 50

[RunMontecarloSimulation]
multi_cpu_threshold = 100  # Use multiple cpus if the run_cnt is above (>=) this threshold
delta_assets_multiplier = 0.025 # +/- 5%
target_confidence_level = 80  # 80%
confidence_level_tolerance = 2.0  # +/- 2%


[ConfigurationManager]
PLT_STYLE = 'seaborn-v0_8-deep'

[ArrayRandGen]
# See ReadMe - historically, S&P 500 has a floor of -47% and a ceiling of 53% - we will use a max of +/- 40% for RoR
RoR_floor = 0.60  # corresponds to a -40% RoR
Ror_ceiling = 1.40  # corresponds to a +40% RoR
clip_flag = true


[MontecarloSimulation]
# run_cnt, nb_cpu, seed and cross_correlated_rvs_flag are set in [default] - shared by all classes
target_end_funds = 5e5
target_success_rate = 80
re_alloc_error = 1e-6
Funds_step = 1e5
Discreet_step = 0.01
Success_threshold = 1.0
mgt_fee =  7e-3
rebalance_flag = true
default_inflation_rate = 2.5e-2  # 2.5 %

[MontecarloSimulationDataLoader]
input_directory = './Data'
lifeplan_file_prefix = 'WFA_life_plan'
lifeplan_date_format = "%Y_%m_%d"
# portfolio_file_prefix = 'JPM/portfolio_by_Asset_class'
# portfolio_file_prefix = 'Morningstar/portfolio_by_Asset_class'
# Holdings by ticker - stats and correlations per ticker come from holdings_cross_corr.py
portfolio_file_prefix = 'Positions'
portfolio_date_format = "%Y_%m_%d"
portfolio_ticker_column = 'Ticker'
portfolio_value_column = 'Market Value'

[CapitalMarkets]
input_directory = './Data'
# capital_markets_file_prefix = './JPM/jpm_capital_markets_stats'
# capital_markets_file_prefix = 'Morningstar/Morningstar_asset_stats'
capital_markets_file_prefix = 'Cross_Corr/holdings_cross_corr_out'
capital_markets_date_format = "%Y_%m_%d"
XLabelLen = 5  # Length of the X axis labels
quick_flag = false
nb_smpl = 1000000

[meta]
# Starting log level for custom_logger: DEBUG, INFO, WARNING, ERROR or CRITICAL
log_level = "INFO"
